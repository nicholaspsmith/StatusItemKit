# Menumon release, called by each app's .github/workflows/release.yml.
# Every push is a release: CHANGELOG.md must open with a new
# "## [X.Y.Z] - YYYY-MM-DD" section (scripts/release/check-release.sh).
#
#   pull_request  check: the PR fails unless its CHANGELOG.md carries that
#                 section, so a PR that skips the rule shows red before merge;
#                 then (macOS runner) scripts/build-app.sh builds the app
#                 against StatusItemKit and HotkeyKit main and
#                 scripts/release/smoke-launch.sh requires it to stay up 5 s
#                 after launch, so an app that dies at launch can't merge
#   push to main  release: tag vX.Y.Z on the pushed commit and publish a
#                 GitHub Release titled "vX.Y.Z" with the section as its notes;
#                 a push that breaks the rule fails loudly
#   release       naming: a release someone made by hand is retitled to its
#                 tag, "vX.Y.Z" (the one naming convention), and flagged
#
# A PR or merged branch whose tip commit says [no release] is skipped.
name: Menumon release

on:
  workflow_call:
    inputs:
      kit-ref:
        description: StatusItemKit ref whose scripts/release (and package) the check uses
        type: string
        default: main

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    # macOS: the check builds the app and launches it (smoke-launch.sh).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # The app and its frameworks side by side, as on a Mac's ~/Code:
      # Package.swift says ../StatusItemKit and ../HotkeyKit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: app
      - uses: actions/checkout@v4
        with:
          repository: nicholaspsmith/StatusItemKit
          ref: ${{ inputs.kit-ref }}
          path: StatusItemKit
      - uses: actions/checkout@v4
        with:
          repository: nicholaspsmith/HotkeyKit
          path: HotkeyKit
      - name: The PR carries a new release
        id: rule
        working-directory: app
        run: |
          git fetch --quiet --tags --force origin
          if git log -1 --format=%B HEAD | grep -qF '[no release]'; then
            echo "::notice::[no release] — this PR will not be released."
            echo "release=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! version="$(../StatusItemKit/scripts/release/check-release.sh HEAD 2>err.txt)"; then
            echo "::error::$(head -1 err.txt)"
            cat err.txt
            exit 1
          fi
          echo "release=yes" >> "$GITHUB_OUTPUT"
          echo "::notice::Merging this PR releases v$version."
      - name: The app stays up after launch
        if: steps.rule.outputs.release == 'yes'
        working-directory: app
        run: |
          if [ ! -x scripts/build-app.sh ]; then
            echo "::notice::No scripts/build-app.sh: nothing to launch."
            exit 0
          fi
          set -o pipefail
          ./scripts/build-app.sh
          shopt -s nullglob
          apps=(build/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::scripts/build-app.sh made no build/*.app"
            exit 1
          fi
          status=0
          for a in "${apps[@]}"; do
            if ! ../StatusItemKit/scripts/release/smoke-launch.sh "$a" 5 | tee smoke.txt; then
              echo "::error::$(head -1 smoke.txt)"
              status=1
            fi
          done
          exit $status

  naming:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Release title is its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          TITLE: ${{ github.event.release.name }}
        run: |
          if [ "$TITLE" = "$TAG" ]; then exit 0; fi
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG"
          echo "::error::Release \"$TITLE\" was made by hand and is now titled \"$TAG\". Releases come from CHANGELOG.md via the release workflow, titled vX.Y.Z — don't create them by hand."
          exit 1

  release:
    if: github.event_name == 'push'
    concurrency: release-${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: nicholaspsmith/StatusItemKit
          path: .menumon-kit
          sparse-checkout: scripts/release
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A merge's second parent is the branch that was merged; its tip
          # is where [no release] would be written.
          tip="$(git rev-parse -q --verify HEAD^2 || git rev-parse HEAD)"
          if git log -1 --format=%B "$tip" | grep -qF '[no release]'; then
            echo "::notice::[no release] — nothing to tag."
            exit 0
          fi
          if ! version="$(.menumon-kit/scripts/release/check-release.sh HEAD 2>err.txt)"; then
            echo "::error::$(head -1 err.txt)"
            cat err.txt
            exit 1
          fi
          awk -v v="$version" '/^## \[/ { inside = (index($0, "## [" v "]") == 1); next } inside' \
            CHANGELOG.md > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version" HEAD
          git push origin "v$version"
          gh release create "v$version" --verify-tag --title "v$version" --notes-file notes.md
          echo "::notice::Released v$version"
